name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guards (secrets + manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the commit-message scan can resolve the base ref.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: node scripts/check-no-secrets.mjs
      - run: node scripts/check-json.mjs
      - name: Scan commit messages on the PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          node scripts/check-no-secrets.mjs --commits "origin/${{ github.base_ref }}..HEAD"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned: unpinned installs pick up default-rule-set changes on a new
        # ruff release and turn lint red on untouched code (0.16.0 did exactly
        # that). Bump deliberately, with the resulting fixes in the same PR.
        run: python -m pip install --upgrade pip "ruff==0.15.4"
      - name: Lint (ruff)
        run: ruff check lib cli tests

  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test (pytest)
        run: python -m pytest tests -q
